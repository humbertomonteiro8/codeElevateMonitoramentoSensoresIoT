services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.3
    container_name: zookeeper_server
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      

  kafka:
    image: confluentinc/cp-kafka:7.4.3  # <- versão estável que funciona com Zookeeper
    container_name: kafka_server
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_server:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  producer:
    build:
      context: .
      dockerfile: container_setup/service_dockerfile/producer.Dockerfile
    container_name: iot_producer
    depends_on:
      - kafka
    restart: always

  consumer:
    build:
      context: .
      dockerfile: container_setup/service_dockerfile/consumer.Dockerfile
    container_name: iot_consumer
    depends_on:
      - kafka
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: iot_data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data_consumer/sql/db_schema.sql:/docker-entrypoint-initdb.d/db_schema.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - default

  dashboard:
    build:
      context: .
      dockerfile: container_setup/service_dockerfile/dashboard.Dockerfile
    container_name: sensor_dashboard
    ports:
      - "8050:8050"
    depends_on:
      - postgres
    restart: always
volumes:
  pgdata:
